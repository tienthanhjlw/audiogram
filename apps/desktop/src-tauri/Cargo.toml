[package]
name = "audiogram"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "audiogram_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
audiogram-core = { path = "../../../crates/audiogram-core" }
audiogram-render = { path = "../../../crates/audiogram-render" }
audiogram-spectrum = { path = "../../../crates/audiogram-spectrum" }
audiogram-subtitle = { path = "../../../crates/audiogram-subtitle" }
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { workspace = true }
serde_json = "1"
thiserror = { workspace = true }
hound = "3"
rubato = "0.15"
rayon = "1"
# Decodes StepLayout's cover image for export — matches the picker's file
# filter (jpg/jpeg/png/webp/gif/bmp) exactly, default-features off to skip
# codecs (tiff/avif/exr/...) the app never offers to pick.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp"] }
# `image` decodes raw pixel data only — it does not apply the EXIF
# `Orientation` tag phone-camera photos commonly carry, unlike browsers
# (which is why the canvas preview shows a photo upright/correctly cropped
# but the exported video showed it sideways with the wrong crop region).
kamadak-exif = "0.5"
# OPTIMIZATION_PLAN.md F7 — whisper model downloads used a `curl` subprocess
# (no guaranteed presence on a clean Windows install). rustls-tls avoids an
# OpenSSL system dependency; blocking client matches the existing
# spawn_blocking call site (presentation/commands/transcript.rs).
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
specta = { workspace = true }
tauri-specta = { version = "=2.0.0-rc.20", features = ["derive", "typescript"] }
specta-typescript = "=0.0.7"
